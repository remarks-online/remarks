name: Deploy MCP

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "packages/mcp-schema/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-mcp.yml"

concurrency:
  group: deploy-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # No db:migrate step: the MCP server doesn't own schema; per Phase 2
      # spec §5.4 it reaches Postgres only through apps/api over Fly's private
      # network.

      # The preflight imports env-check helpers from @remarks/shared, whose
      # workspace package.json points "main" at dist/index.js. pnpm install
      # doesn't compile workspace packages, so build it explicitly before the
      # preflight runs (the Docker build below builds it again inside its
      # own multistage; this is just for the host-side check).
      - run: pnpm --filter @remarks/shared build

      # Preflight: fail fast if envSchema requires an env var that isn't
      # provided by fly.toml [env] or fly secrets. Prevents the class of
      # regression where a new required var ships to main but the
      # corresponding Fly secret was never set, causing a crash loop at boot.
      - run: pnpm --filter @remarks/mcp check-fly-secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy --config apps/mcp/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
