name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test

      # MinIO runs as a step (not a service) because GitHub Actions services
      # can't override the image's CMD, and the official minio/minio image
      # needs `server /data` to start. Creds/port match the R2 env below.
      - name: Start MinIO for R2 integration tests
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "minio ready"; exit 0
            fi
            sleep 2
          done
          echo "minio failed to become ready"; docker logs minio; exit 1

      - run: pnpm turbo run test:integration
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/test
          R2_S3_ENDPOINT: http://localhost:9000
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: minioadmin
          R2_SECRET_ACCESS_KEY: minioadmin
          R2_BUCKET_SCREENSHOTS: remarks-screenshots-test

      - run: pnpm turbo run build
        env:
          # Placeholder Clerk keys so `next build` can prerender the dashboard's
          # <ClerkProvider>-wrapped root layout. These are decoy values (base64
          # decodes to "clerk.placeholder.dev$") and never touch a real Clerk
          # instance; production builds on Vercel inject real secrets.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsucGxhY2Vob2xkZXIuZGV2JA==
          CLERK_SECRET_KEY: sk_test_ci_placeholder_not_for_prod
          # Placeholder API base URL — the dashboard's env.ts validates this
          # at module load, which fires during Next.js page-data collection
          # even for force-dynamic routes. The value is never dialed during
          # CI build; production builds on Vercel inject the real Fly URL.
          NEXT_PUBLIC_API_BASE_URL: http://api.placeholder.invalid

  # Task 1.31: extension Playwright happy-path suite. Runs in parallel with
  # `check` so a lint/test break doesn't gate the e2e signal (and vice versa).
  # Requires real Clerk dev creds via repo secrets (`CLERK_SECRET_KEY`,
  # `NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY`) — the fixture mints a sign-in ticket
  # against the same dev instance used for the dashboard suite + the verify
  # suite, and the dev instance must allowlist
  # chrome-extension://baikikfefeheiildmfoaicbjbnbecgjd (one-time, see
  # docs/runbooks/extension-clerk-synchost.md).
  extension-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Postgres service container above; same shape as the `check` job so the
      # job is self-contained (no shared state between jobs).
      DATABASE_URL: postgres://postgres:test@localhost:5432/test
      # Real Clerk dev creds — fixture mints sign-in tickets against this
      # instance, dashboard's ClerkProvider verifies them, popup's syncHost
      # picks up the resulting session.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # Webhook secret — never invoked in this suite, but apps/api/src/env.ts
      # requires it at boot. Placeholder satisfies the schema (whsec_ prefix).
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder_not_invoked
      # R2 placeholders — none of the happy-path specs trigger an upload, but
      # apps/api/src/env-schema.ts requires these to be present.
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci_placeholder
      R2_SECRET_ACCESS_KEY: ci_placeholder
      R2_BUCKET_SCREENSHOTS: remarks-screenshots-test
      # WXT bakes these into the extension bundle at build time. SYNC_HOST and
      # API_URL match the localhost ports the dashboard + api dev servers bind.
      WXT_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      WXT_CLERK_SYNC_HOST: http://localhost:3000
      WXT_API_URL: http://localhost:4000
      # Dashboard reads NEXT_PUBLIC_API_BASE_URL for its tRPC client.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apply Drizzle migrations before the API starts. The dev API doesn't
      # auto-migrate (per spec §9.4); the integration suite migrates inside its
      # own harness, but e2e drives a long-running dev server, so we need an
      # explicit migrate step.
      - run: pnpm --filter @remarks/db db:migrate

      - name: Install Playwright browsers + system deps
        run: pnpm --filter @remarks/extension exec playwright install --with-deps chromium

      # MV3 service workers don't register reliably in headless Chromium, so
      # the fixture launches headed. xvfb-run gives the runner a virtual X
      # display so the headed launch works without a real display.
      - name: Run extension e2e
        run: xvfb-run -a pnpm --filter @remarks/extension test:e2e
