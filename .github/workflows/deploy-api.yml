name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The preflight imports env-check helpers from @remarks/shared, whose
      # workspace package.json points "main" at dist/index.js. pnpm install
      # doesn't compile workspace packages, so build it explicitly before the
      # preflight runs (the Docker build below builds it again inside its
      # own multistage; this is just for the host-side check).
      - run: pnpm --filter @remarks/shared build

      # Preflight: fail fast if envSchema requires an env var that isn't
      # provided by fly.toml [env] or fly secrets. Prevents the class of
      # regression where a new required var ships to main but the
      # corresponding Fly secret was never set, causing a crash loop at boot.
      - run: pnpm --filter @remarks/api check-fly-secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Apply pending Drizzle migrations against the prod direct endpoint
      # before shipping a new image. The runtime DATABASE_URL Fly secret is
      # the pooled (pgbouncer) endpoint, which can't run DDL — migrations
      # need Neon's direct (non-pooler) endpoint, stored as PROD_DATABASE_URL
      # here. A failure here aborts the workflow so flyctl deploy below
      # never ships code that expects schema we couldn't apply.
      - run: pnpm --filter @remarks/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - run: flyctl deploy --config apps/api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
