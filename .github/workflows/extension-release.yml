name: extension-release

on:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "!apps/extension/scripts/release.mjs"
      - "!apps/extension/scripts/README.md"
      - "!apps/extension/**/*.md"
      - "!apps/extension/**/*.test.ts"
      - "!apps/extension/**/*.test.tsx"
      - "!apps/extension/e2e/**"
      - "!apps/extension/verify/**"

# Prevent overlapping bumps if two PRs merge in quick succession; the second
# run waits for the first to finish (its push will retrigger this workflow).
concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Don't loop on the bump commit this workflow makes.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # If the merge commit already changed the version field (e.g., the PR
      # author bumped manually for a minor/major release), skip the auto
      # patch bump. Either way, we tag at the end.
      - name: Detect manual version bump
        id: detect
        run: |
          before=$(git show HEAD~1:apps/extension/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          after=$(node -e "console.log(require('./apps/extension/package.json').version)")
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            echo "Manual bump detected: $before → $after"
          else
            echo "manual=false" >> "$GITHUB_OUTPUT"
            echo "No manual bump; will auto-patch from $before"
          fi

      - name: Auto-bump patch (only if no manual bump)
        if: steps.detect.outputs.manual == 'false'
        run: pnpm --filter @remarks/extension release -- --patch --skip-build

      - name: Read final version
        id: version
        run: |
          v=$(node -e "console.log(require('./apps/extension/package.json').version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Commit + tag the release
        if: steps.detect.outputs.manual == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/extension/package.json
          git commit -m "chore(extension): release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "extension-v${{ steps.version.outputs.version }}"
          git push origin HEAD:main "extension-v${{ steps.version.outputs.version }}"

      - name: Tag manual release
        if: steps.detect.outputs.manual == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "extension-v${{ steps.version.outputs.version }}"
          git push origin "extension-v${{ steps.version.outputs.version }}"

      # Build the prod extension here so the resulting zip can be published
      # to R2 for /app/download-extension (ADR-0017). Repo secrets supply the
      # prod Clerk + dashboard URLs that wxt bakes into the bundle.
      - name: Build production extension
        env:
          NODE_ENV: production
          WXT_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXTENSION_PROD_CLERK_PUBLISHABLE_KEY }}
          WXT_CLERK_SYNC_HOST: ${{ secrets.EXTENSION_PROD_CLERK_SYNC_HOST }}
          WXT_API_URL: ${{ secrets.EXTENSION_PROD_API_URL }}
          WXT_DASHBOARD_URL: ${{ secrets.EXTENSION_PROD_DASHBOARD_URL }}
        run: pnpm --filter @remarks/extension build:prod

      - name: Zip extension
        run: pnpm --filter @remarks/extension zip

      - name: Locate zip
        id: zip
        run: |
          # Resolve to an absolute path. The upload step runs the script via
          # `pnpm --filter @remarks/scripts`, which cd's into tools/scripts/ —
          # a repo-relative path doesn't survive that cwd shift.
          zip_path=$(ls "$GITHUB_WORKSPACE"/apps/extension/.output/*-chrome.zip | head -n1)
          if [ -z "$zip_path" ]; then
            echo "no chrome zip produced under apps/extension/.output/"; exit 1
          fi
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"
          sha=$(sha256sum "$zip_path" | awk '{print $1}')
          size=$(stat -c%s "$zip_path")
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_EXTENSION_BUILDS: ${{ secrets.R2_BUCKET_EXTENSION_BUILDS }}
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: pnpm --filter @remarks/scripts upload-extension-build

      - name: Notify
        run: |
          echo "## Extension v${{ steps.version.outputs.version }} published" >> $GITHUB_STEP_SUMMARY
          echo ""                              >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`extension-v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Zip: \`${{ steps.zip.outputs.path }}\` (${{ steps.zip.outputs.size }} bytes, sha256=${{ steps.zip.outputs.sha256 }})" >> $GITHUB_STEP_SUMMARY
          echo ""                              >> $GITHUB_STEP_SUMMARY
          echo "Uploaded to R2:" >> $GITHUB_STEP_SUMMARY
          echo "- \`releases/chrome/remarks-chrome-${{ steps.version.outputs.version }}.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`releases/chrome/latest.json\`" >> $GITHUB_STEP_SUMMARY
          echo ""                              >> $GITHUB_STEP_SUMMARY
          echo "The dashboard's /app/download-extension page will surface this build immediately." >> $GITHUB_STEP_SUMMARY
          echo ""                              >> $GITHUB_STEP_SUMMARY
          echo "Chrome Web Store upload remains manual — drag the zip from artifacts (or rebuild from the tag) to https://chrome.google.com/webstore/devconsole" >> $GITHUB_STEP_SUMMARY

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: remarks-chrome-v${{ steps.version.outputs.version }}
          path: apps/extension/.output/*-chrome.zip
          retention-days: 90
